[build]
  base = "frontend"
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

# Redirect API calls to the Vercel backend (set this to your deployed Vercel URL)
[[redirects]]
  from = "/api/*"
  to = "https://partime-job.vercel.app/api/:splat"
  status = 200
  force = true

# SPA redirect rule: serve index.html for all non-API routes (React Router support)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
